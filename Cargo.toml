[package]
name = "capri-bar"
version = "0.1.0"
edition = "2024"

[dependencies]
# Slint is built without its default desktop backend: the island window is created
# and driven by src/island_window.rs and src/island_platform.rs, so winit is not
# linked at all.
slint = { version = "1.18.1", default-features = false, features = [
    "compat-1-2",
    "renderer-software",
    "std",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18.1"

# Development machine is a 2007 Core 2 Duo with 2.9 GB of RAM: debug info makes
# every build and link heavier than it is useful here.
[profile.dev]
debug = 0
